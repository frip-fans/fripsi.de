name: CI

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build workspaces
        run: npm run build
      - name: Build production web
        run: npm run build:production --workspace @frip-fan/web
      - name: Build staging web
        run: npm run build:web:staging

  sqlite-backup:
    name: SQLite backup safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install isolated backup test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes age python3-venv
          python3 -m venv "$RUNNER_TEMP/backup-tests"
          "$RUNNER_TEMP/backup-tests/bin/pip" install -r ops/sqlite-backup/requirements-test.txt
      - name: Exercise online snapshots, encryption, restore and failures
        run: '"$RUNNER_TEMP/backup-tests/bin/python" -m unittest discover -s ops/sqlite-backup -v'
