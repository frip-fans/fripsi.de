name: CI

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build standalone Node release
        run: npm run build
      - name: Verify code-only release packaging
        run: python3 -m unittest discover -s ops/oci -v

  sqlite-backup:
    name: SQLite backup safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install isolated backup test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes age python3-venv
          python3 -m venv "$RUNNER_TEMP/backup-tests"
          "$RUNNER_TEMP/backup-tests/bin/pip" install -r ops/sqlite-backup/requirements-test.txt
      - name: Exercise online snapshots, encryption, restore and failures
        run: '"$RUNNER_TEMP/backup-tests/bin/python" -m unittest discover -s ops/sqlite-backup -v'
