name: OCI deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production, all]
        default: staging
        description: Deploy the latest protected branch head after successful source CI
      apply_production_migrations:
        type: boolean
        default: false
        description: Apply pending additive schema migrations on production before activating the release
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: oci-deployment
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.probe.outputs.matrix }}
      changed: ${{ steps.probe.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ENVIRONMENT: ${{ inputs.environment || 'all' }}
        run: python3 probe.py

  build:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: frip-fans/fripsi.de
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:web:node
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Package code-only standalone release
        env:
          SOURCE_SHA: ${{ matrix.sha }}
        run: |
          python3 ops/oci/package-release.py --sha "$SOURCE_SHA" --output release.tgz
          sha256sum release.tgz > release.tgz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-${{ matrix.environment }}-${{ matrix.sha }}
          path: |
            release.tgz
            release.tgz.sha256
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: [plan, build]
    if: needs.plan.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: [self-hosted, Linux, X64, deploy-only, '${{ matrix.runner }}']
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ matrix.sha }}
      SOURCE_BRANCH: ${{ matrix.branch }}
      DEPLOY_ENVIRONMENT: ${{ matrix.environment }}
      GH_TOKEN: ${{ github.token }}
      # Staging applies additive migrations automatically. Production only checks unless a person
      # starts this run with apply_production_migrations; pending migrations then block activation.
      MIGRATE_MODE: ${{ (matrix.environment == 'staging' || inputs.apply_production_migrations) && 'apply' || 'check' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-${{ matrix.environment }}-${{ matrix.sha }}
          path: incoming
      - name: Reject superseded source heads and create deployment record
        id: record
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          def api(path,data=None):
              request=urllib.request.Request('https://api.github.com/'+path,data=json.dumps(data).encode() if data else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: return json.load(response)
          head=api('repos/frip-fans/fripsi.de/commits/'+os.environ['SOURCE_BRANCH'])['sha']
          if head!=os.environ['SOURCE_SHA']: raise SystemExit('Source head advanced; refusing a stale deployment')
          deployment=api('repos/frip-fans/fripside-deploy/deployments',{'ref':os.environ['GITHUB_SHA'],'auto_merge':False,'required_contexts':[],'environment':os.environ['DEPLOY_ENVIRONMENT'],'task':'deploy_node','payload':{'source_sha':head,'source_repository':'frip-fans/fripsi.de'}})
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('id='+str(deployment['id'])+'\n')
          PY
      - name: Verify, migrate and activate release
        run: |
          cd incoming
          sha256sum --check release.tgz.sha256
          python3 /usr/local/bin/fripside-install-release --archive release.tgz --sha "$SOURCE_SHA" --migrate "$MIGRATE_MODE"
      - name: Record deployment result
        if: always() && steps.record.outputs.id
        env:
          DEPLOYMENT_ID: ${{ steps.record.outputs.id }}
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          state='success' if os.environ['DEPLOY_RESULT']=='success' else 'failure'
          body={'state':state,'auto_inactive':True,'environment_url':'https://'+('staging.fripsi.de' if os.environ['DEPLOY_ENVIRONMENT']=='staging' else 'fripsi.de'),'log_url':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          request=urllib.request.Request('https://api.github.com/repos/frip-fans/fripside-deploy/deployments/'+os.environ['DEPLOYMENT_ID']+'/statuses',data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response: print('Deployment result recorded:',state)
          PY
      - name: Remove downloaded artifact
        if: always()
        run: rm -rf incoming
